name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MalayalamLiveTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MalayalamLiveTV-apk
          path: MalayalamLiveTV.apk
      # Publishes the plain .apk (no zip) as the latest release, so it can be opened
      # straight from the phone or TV:
      # https://github.com/<owner>/<repo>/releases/latest/download/MalayalamLiveTV.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.1.${GITHUB_RUN_NUMBER}" MalayalamLiveTV.apk \
            --title "Malayalam Live TV 1.1.${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA::7}." --latest
